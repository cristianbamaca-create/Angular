<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm p-4">
        
        <h3 class="text-center mb-4">Sistema de cine</h3>

        <form [formGroup]="formulario" (ngSubmit)="guardar()">
          
          <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" class="form-control" formControlName="correo" placeholder="ejemplo@gmail.com">
            @if(formulario.get('correo')?.invalid && formulario.get('correo')?.touched){
              <div class="text-danger small mt-1">El email es obligatorio</div>
            }
          </div>

          <div class="mb-3">
            <label class="form-label">Password:</label>
            <input type="password" class="form-control" formControlName="contrasena">
            @if(formulario.get('contrasena')?.invalid && formulario.get('contrasena')?.touched){
              <div class="text-danger small mt-1">El password es obligatorio</div>
            }
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-success">Ingresar</button>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
